site_name: slipsolve
site_description: Geodetic slip inversion on triangular fault meshes, from InSAR, pixel offsets and GNSS.
site_url: https://eitanrapa.github.io/SlipSolve-Python/
repo_url: https://github.com/eitanrapa/SlipSolve-Python
repo_name: eitanrapa/SlipSolve-Python
edit_uri: ""
copyright: Copyright &copy; 2026 Eitan Rapaport and Xiaoyu Zou. MIT licence.

theme:
  name: material
  features:
    - content.code.copy
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

markdown_extensions:
  - admonition
  - attr_list
  - tables
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: numpy
            show_source: false
            members_order: source
            filters: ["!^_"]
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true
            show_root_heading: true

nav:
  - Home: index.md
  - Installation: installation.md
  - Getting started: getting-started.md
  - User guide:
      - Conventions: guide/conventions.md
      - Faults and meshes: guide/faults-and-meshes.md
      - Observations: guide/observations.md
      - Elastic models: guide/elastic-models.md
      - The inversion: guide/inversion.md
      - Regularization and resolution: guide/regularization.md
      - Dip sweeps: guide/dip-sweeps.md
      - Production runs: guide/production.md
      - Bimaterial faults: guide/bimaterial.md
      - 3-D heterogeneity: guide/heterogeneity.md
      - Postseismic and interseismic: guide/time-dependent.md
  - API reference:
      - api/index.md
      - Geometry: api/geometry.md
      - Observations: api/observations.md
      - Elastic models: api/elastic-models.md
      - Contrasts and 3-D structure: api/structure.md
      - Inversion: api/inversion.md
      - Resolution and calibration: api/resolution.md
      - Geometry search: api/geometry-search.md
      - Production runs: api/production.md
      - Plotting: api/plotting.md
      - Postseismic and interseismic: api/time-dependent.md
  - Relation to SlipSolve-Curve: slipsolve-curve.md
  - Development: development.md
